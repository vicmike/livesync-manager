{{- if and .Values.telemetry.couchdbLogs.enabled .Values.telemetry.couchdbLogs.createRbac }}
{{- $namespace := required "telemetry.couchdbLogs.namespace is required when telemetry RBAC is enabled" .Values.telemetry.couchdbLogs.namespace }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "livesync-manager.fullname" . }}-couchdb-log-reader
  namespace: {{ $namespace }}
  labels:
    {{- include "livesync-manager.labels" . | nindent 4 }}
rules:
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list]
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "livesync-manager.fullname" . }}-couchdb-log-reader
  namespace: {{ $namespace }}
  labels:
    {{- include "livesync-manager.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "livesync-manager.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "livesync-manager.fullname" . }}-couchdb-log-reader
{{- end }}
